name: Release Preparation
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare-release:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.head_ref != 'chore/release')
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        id: git-cliff
        with:
          config: cliff.toml
          args: --verbose --bump
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}
      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-edit
      - name: Update Cargo version
        shell: bash
        env:
          RAW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          VERSION="${RAW_VERSION#v}"
          echo "Cargo version: ${VERSION}"
          cargo set-version "${VERSION}"
      - run: cargo check
      - name: Prepare release PR body
        if: github.event_name == 'push'
        shell: pwsh
        env:
          RAW_VERSION: ${{ steps.git-cliff.outputs.version }}
        run: |
          $version = $env:RAW_VERSION.TrimStart('v')
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match(
            $changelog,
            "(?ms)^## \[$([regex]::Escape($version))\][^\r\n]*\r?\n.*?(?=^## \[|^<!-- generated by git-cliff -->|\z)"
          )
          if (-not $section.Success) {
            throw "Release notes for $env:RAW_VERSION were not found in CHANGELOG.md"
          }

          $bodyPath = Join-Path $env:RUNNER_TEMP 'release-pr-body.md'
          [System.IO.File]::WriteAllText($bodyPath, $section.Value, [System.Text.UTF8Encoding]::new($false))
      # Only create PR on push events
      - if: github.event_name == 'push'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          title: "chore(release): prepare for ${{ steps.git-cliff.outputs.version }}"
          branch: "chore/release"
          add-paths: "CHANGELOG.md, Cargo.toml, Cargo.lock"
          body-path: ${{ runner.temp }}/release-pr-body.md
          commit-message: "chore(release): prepare for ${{ steps.git-cliff.outputs.version }}"
